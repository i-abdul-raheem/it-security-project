[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spn-dc"
version = "0.1.0"
description = "Differential propagation modeling for configurable SPNs"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
ui = ["streamlit>=1.62"]

[project.scripts]
spn-dc = "spn_dc.cli:main"
spn-dc-ui = "spn_dc.launch_ui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spn_dc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
